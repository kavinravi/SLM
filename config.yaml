seed: 3619

model:
  d_model: 1280
  n_heads: 20
  n_layers: 24
  d_ff: 5120
  context_length: 2048
  dropout: 0.0

training:
  peak_lr: 2.0e-4
  min_lr: 2.0e-5
  warmup_steps: 2000
  max_steps: 100000
  micro_batch_size: 8
  gradient_accumulation_steps: 32
  gradient_clip: 1.0
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  compile: true
  gradient_checkpointing: true
  log_interval: 100
  eval_interval: 1000
  eval_steps: 50
  save_interval: 2000
  checkpoint_dir: checkpoints
  resume_from: checkpoints/best.pt

tokenizer:
  vocab_size: 50000
  min_frequency: 2
  sample_size_gb: 2
  save_dir: tokenizer

data:
  dataset: HuggingFaceFW/fineweb
  name: default
  split: train
  text_field: text
  min_doc_length: 100

wandb:
  project: slm-fineweb
  enabled: true
